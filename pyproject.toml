[tool.vercel]
entrypoint = "backend.app.main:app"
framework = "fastapi"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parkpilot"
version = "1.0.0"
description = "ParkPilot - Smart Parking Management System"
requires-python = ">=3.11"
dependencies = [
    "starlette==0.38.6",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.1",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.3",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "email-validator==2.2.0",
]
